<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certo UI</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<!-- ================= NAVBAR ================= -->
<header class="main-header">
    <div class="container d-flex justify-content-between align-items-center">

        <!-- Logo -->
        <div class="logo-box">
    <img src="assets/images/logo.png" alt="logo">
</div>

        <!-- Navigation -->
        <ul class="nav-menu d-none d-lg-flex">
            <li>iPhone</li>
            <li>Android</li>
            <li>Help</li>
            <li>Company</li>
        </ul>

        <!-- Button -->
        <button class="btn login-btn">Sign in</button>

    </div>
</header>


<!-- ================= HERO SECTION ================= -->
<section class="hero-section">
    <div class="container">
        <div class="row align-items-center">

            <!-- LEFT CONTENT -->
            <div class="col-lg-6">
                <h1>
                    Your mobile privacy <br>
                    is our mission
                </h1>

                <p>
                    Think your phone has been hacked? Our trusted apps make it easy
                    for you to scan, detect and remove threats from your iPhone and Android devices.
                </p>

                <div class="buttons">
                    <button class="btn btn-yellow">
                        Get Certo for iPhone →
                    </button>

                    <button class="btn btn-outline-dark">
                        Get Certo for Android
                    </button>
                </div>
            </div>

            <!-- RIGHT IMAGES -->
            <div class="col-lg-6">
                <div class="image-wrapper">

                    <!-- background image -->
                    <img src="assets/images/bg.png" class="bg">

                    <!-- phone image -->
                    <img src="assets/images/phone.png" class="phone">

                </div>
            </div>

        </div>
    </div>
</section>

</body>
</html>
