<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certo Landing Page</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<!-- NAVBAR START -->
<header class="navbar-custom">
  <div class="container d-flex justify-content-between align-items-center py-3">

    <!-- Logo -->
    <div class="d-flex align-items-center gap-2">
      <img src="assets/images/logo.png" class="logo" alt="logo">
      <span class="brand">Certo</span>
    </div>

    <!-- Menu -->
    <ul class="nav d-none d-lg-flex align-items-center gap-4">
      <li>iPhone</li>
      <li>Android</li>
      <li>Help</li>
      <li>Company ▾</li>
      <li>
        <button class="btn btn-signin">Sign in</button>
      </li>
    </ul>

  </div>
</header>
<!-- NAVBAR END -->


<!-- HERO SECTION START -->
<section class="hero">
  <div class="container">
    <div class="row align-items-center">

      <!-- LEFT SIDE -->
      <div class="col-lg-6 col-12">
        <h1 class="hero-title">
          Your mobile privacy <br> is our mission
        </h1>

        <p class="hero-text">
          Think your phone has been hacked? Our trusted apps make it easy
          for you to scan, detect and remove threats from your iPhone and
          Android devices.
        </p>

        <div class="d-flex gap-3 flex-wrap">
          <button class="btn btn-yellow">
            Get Certo for iPhone →
          </button>

          <button class="btn btn-outline-custom">
            Get Certo for Android
          </button>
        </div>
      </div>

      <!-- RIGHT SIDE -->
      <div class="col-lg-6 col-12">
        <div class="hero-image-box">

          <!-- Background Image -->
          <img src="assets/images/bg.png" class="bg-img" alt="background">

          <!-- Phone Image -->
          <img src="assets/images/phone.png" class="phone-img" alt="phone">

        </div>
      </div>

    </div>
  </div>
</section>
<!-- HERO SECTION END -->


</body>
</html>
